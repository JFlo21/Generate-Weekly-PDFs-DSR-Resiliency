# Build check for the Docusaurus runbook (website/).
#
# Purpose: Vercel is the only place the runbook gets built at deploy time.
# A broken docusaurus.config.ts, sidebar entry, or MDX error would
# otherwise ship to master unnoticed and silently stop the site from
# updating — this check catches it on the PR instead. It is path-filtered
# so it only spends CI minutes when the docs site actually changes.
name: Docs Site Build

on:
  pull_request:
    branches: [master]
    paths:
      - 'website/**'
      - '.github/workflows/docs-site-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-site-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck and build runbook
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build (mirrors the Vercel production build)
        run: npm run build
